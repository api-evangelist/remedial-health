name: Remedial Health
description: >-
  Remedial Health is a Nigeria-based healthtech company digitizing pharmaceutical
  procurement and pharmacy operations across Africa. Its platform connects retail
  pharmacies, hospitals, clinics, health insurers/HMOs, and pharmaceutical
  manufacturers through a set of products: Remedial Store (a digital marketplace
  for pharmacies to procure inventory), Remedial RX (daily pharmacy operations
  and inventory tooling), Remedial Buy Now-Pay Later (inventory financing), the
  Remedial Benefits Manager (clinical pharmacy services and medication delivery
  for insurers), Remedial Market Access (distribution reach for manufacturers),
  and Remedial Intelligence (supply-chain data insights). The company is
  backed by QED Investors and reaches its customers primarily through Android and
  iOS mobile apps. As of this enrichment pass Remedial Health publishes no public
  API, developer portal, or documentation host; this profile captures its
  identity, legal, and domain-security posture.
